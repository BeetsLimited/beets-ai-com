name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once; let the in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: every resource's version, datePublished and dateModified
          # is derived from the commit log (scripts/gen-revisions.mjs). A shallow
          # checkout reports one commit per file, i.e. every page silently reverts
          # to "1.0, published today".
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type + content-schema check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check internal links
        run: npm run check:links

      - name: Check one language per page
        run: npm run check:lang

      - name: Check no page repeats a heading
        run: npm run check:structure

      - name: Check no dark blocks on a light-only site
        run: npm run check:contrast

      # Asserts a RELATIONSHIP between two rules in the built CSS (the nav's links
      # and its two <details> groups must set the same font-size, or the group
      # labels sit 1.7px low). No other gate can see it: see the script header.
      - name: Check the nav items share one baseline
        run: npm run check:nav

      # Billy, 2026-10-11: never put internal process, internal codes or internal
      # records on a customer-facing surface. See the script header for what it
      # catches and what it deliberately leaves alone.
      - name: Check no internal material is published
        run: npm run check:public-copy

      # The one gate that was missing from CI while this file said it was
      # blocking; added 2026-10-11 when the file was next open.
      - name: Check the catalogue lists exactly what was built
        run: npm run check:catalogue

      # Billy, 2026-10-12: every page must carry the metadata a search engine
      # needs — one h1, a title, a description, alt text on every image, ASCII
      # slugs. None of the seven gates above reads any of it. See the script
      # header for the budgets and for the width model behind them.
      - name: Check page metadata
        run: npm run check:meta

      - name: Check external links (non-blocking)
        run: npm run check:links:external
        continue-on-error: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
